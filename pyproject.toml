[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-classical-expressivity"
version = "0.1.0"
description = "Expressivity of data encodings: parameterised quantum circuits vs classical neural networks on quantum-generated datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luigi Cippone" }]
requires-python = ">=3.10"
keywords = ["quantum machine learning", "parameterised quantum circuits", "variational classifier", "data encoding", "expressivity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
cirq = ["cirq-core>=1.2"]
keras = ["tensorflow>=2.16"]
notebook = ["jupyter"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
expressivity-benchmark = "expressivity.training:main"

[project.urls]
Repository = "https://github.com/lew-8/quantum-classical-expressivity"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]  # zip() strictness is not needed for these fixed-length loops

[tool.ruff.lint.per-file-ignores]
# Notebook cells favour compact plotting code and set up sys.path before importing.
"*.ipynb" = ["E402", "E501", "E702", "E741", "I001", "UP039"]

[tool.coverage.run]
source = ["expressivity"]
